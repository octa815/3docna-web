# Sitio estático: se publica la raíz tal cual. Las páginas se generan con
# `python3 tools/build.py` antes de hacer push (no hace falta build en Netlify).
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-cache"

# URLs cortas que ya circulaban
[[redirects]]
  from = "/catalogo"
  to = "/catalogo.html"
  status = 200
[[redirects]]
  from = "/pedido"
  to = "/pedido.html"
  status = 200
[[redirects]]
  from = "/contacto"
  to = "/contacto.html"
  status = 200
[[redirects]]
  from = "/configurador"
  to = "/configurador.html"
  status = 200
